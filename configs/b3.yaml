# B3 (= A4) = A3 + evidence gate and answer checks. The final system.
retrieval_mode: hybrid
chunk_strategy: struct@v1
rerank: true
gate: true
gate_threshold: -4.6741        # tuned on dev (S15): lowest threshold tied for best dev correctness;
                               # same dev results as no gate. reports/artifacts/gate_tuning_dev.json
checks: [citation_validity, claim_support, number_date, quote_limit]

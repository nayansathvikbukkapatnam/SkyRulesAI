# Shared settings for every run. Each configs/<name>.yaml overrides only what it changes.
# Secrets and machine-specific values (AWS profile, region, model ID) live in .env.

# --- Ablation switches (CLAUDE.md section 5) ---
closed_book: false
retrieval_mode: dense          # dense | bm25 | hybrid
chunk_strategy: fixed@v1       # fixed@v1 | struct@v1
rerank: false
gate: false
gate_threshold: null           # tuned on the dev split (S15); null = not tuned yet
checks: []                     # any of: citation_validity, claim_support, number_date, quote_limit
generator_model: null          # null = read BEDROCK_MODEL_ID from .env

# --- Fixed settings (change only through a reviewed PR) ---
chunking:
  max_tokens: 512
  overlap_tokens: 64
embedding:
  model: BAAI/bge-small-en-v1.5
  dimension: 384
  normalize: true
  batch_size: 64
vector_db:
  collection: skyrules
  distance: cosine             # Chroma's default is L2, so this is set explicitly
retrieval:
  pool_size: 20
  rrf_k: 60
rerank_settings:
  model: cross-encoder/ms-marco-MiniLM-L-6-v2
  top_n: 5
generation:
  temperature: 0
  max_tokens: 1024
  # Fill from the Bedrock pricing page for our region before reporting cost (P1).
  price_per_mtok_input_usd: null
  price_per_mtok_output_usd: null
checks_settings:
  quote_max_words: 25
eval:
  split_seed: 42
  dev_fraction: 0.6

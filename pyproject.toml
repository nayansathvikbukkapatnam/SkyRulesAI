[project]
name = "skyrules-ai"
version = "0.1.0"
description = "Retrieval-augmented chatbot for U.S. drone rules, answered from FAA pages"
requires-python = ">=3.11,<3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs/ui", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

# Lint and unit tests on every pull request and on main (CLAUDE.md section 9.1, N5).
# Tests run on tests/fixtures only: no API keys, no AWS, no requests to faa.gov, and
# no model downloads (tests that need a real model skip when it is not cached).

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # requirements.txt is frozen on macOS. On Linux the default torch wheel pulls
      # in several GB of CUDA packages; the CPU build of the same version avoids that,
      # and pip then treats the pinned torch==X as already satisfied.
      - name: Install CPU-only torch
        run: |
          python -m pip install --upgrade pip
          torch_version="$(grep -i '^torch==' requirements.txt | cut -d= -f3)"
          pip install "torch==${torch_version}" --index-url https://download.pytorch.org/whl/cpu

      - name: Install pinned requirements
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: pytest
